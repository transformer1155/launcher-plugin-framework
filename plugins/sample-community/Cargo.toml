[package]
name = "sample-community"
description = "示例社区插件：跑沙箱，演示降级路径与崩溃重启（无签名）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
launcher-plugin-framework = { workspace = true }
launcher-plugin-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 演示"可中断超时"需要 tokio::time::sleep：它在等待期间不占用 poll，
# 因此 aborter 能真正中止它。用 std::thread::sleep 会变成"不可中断"，那是另一个演示点。
tokio = { workspace = true }
