[workspace]
resolver = "2"
members = [
    "common",
    "official-instance",
    "official-mod",
    "official-launch",
    "sample-community",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
# 框架层：插件只能依赖它，不能改它。
launcher-plugin-framework = { path = ".." }
# 插件共享层。
launcher-plugin-common = { path = "common" }

# 以下依赖框架里已经存在，插件复用同一版本，不引入新生态。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
